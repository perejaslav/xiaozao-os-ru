<!-- ===================== Скрипты =====================
     Порядок обязателен: сначала словари ru -> zh, затем рантайм i18n,
     и только потом прикладные модули. Все теги с defer, поэтому браузер
     выполняет их строго в порядке документа ещё до DOMContentLoaded.
     Пути только относительные: страница работает и в корне домена, и в подкаталоге. -->
<script defer src="os/i18n/dict.ru.js"></script>
<script defer src="os/i18n/dict.zh.js"></script>
<script defer src="os/i18n/i18n.js"></script>
<script defer src="image-slot.js"></script>
<script defer src="os/wm.js?v=20260614-2"></script>
<script defer src="os/content.js?v=20260612-2"></script>
<script defer src="os/cases.js?v=20260612-6"></script>
<script defer src="os/apps.js?v=20260614-1"></script>
<script defer src="os/desk.js?v=20260614-1"></script>
<script defer src="os/analytics.js?v=20260629-1"></script>
<script defer src="os/presence.js?v=20260629-2"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var I18N = window.XZI18N || {
      date: function (v, o) { return new Date(v).toLocaleString('ru-RU', o); },
      t: function (k) { return k; }
    };

    // Экран блокировки: часы + разблокировка
    (function () {
      var lock = document.getElementById('lockscreen');
      var lt = document.getElementById('lock-time');
      var ld = document.getElementById('lock-date');
      if (!lock || !lt || !ld) return;
      function pad(n) { return (n < 10 ? '0' : '') + n; }
      function tick() {
        var d = new Date();
        lt.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
        ld.textContent = I18N.date(d, { month: 'long', day: 'numeric', weekday: 'short' });
      }
      tick();
      var timer = setInterval(tick, 15000);
      var unlocked = false;
      function unlock() {
        if (unlocked) return;
        unlocked = true;
        clearInterval(timer);
        lock.classList.add('out');
        setTimeout(function () {
          lock.remove();
          document.body.classList.remove('is-locked');
          // Открываем по очереди: терминал -> файлы -> браузер -> WeChat, со смещением
          var d = document.querySelector('.desktop');
          var W = d.clientWidth, H = d.clientHeight;
          XZApps.open('term', { x: W * 0.55, y: H * 0.06, silent: true });
          setTimeout(function () { XZApps.open('doc', { x: W * 0.06, y: H * 0.12, silent: true }); }, 450);
          setTimeout(function () { XZApps.open('fx', { x: Math.max(16, W * 0.42), y: H * 0.12, silent: true }); }, 900);
          setTimeout(function () { XZApps.open('qrwx', { x: W * 0.76, y: H * 0.42, silent: true }); }, 1250);
        }, 550);
      }
      document.getElementById('lock-enter').addEventListener('click', unlock);
      window.addEventListener('keydown', function (e) {
        if (!unlocked && (e.key === 'Enter' || e.key === ' ')) unlock();
      });
    })();

    // Часы в строке меню
    (function () {
      var el = document.getElementById('os-clock');
      if (!el) return;
      function tick() {
        el.textContent = I18N.date(new Date(), { month: 'short', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' });
      }
      tick();
      setInterval(tick, 15000);
    })();

    // Число пользователей онлайн
    (function () {
      var el = document.getElementById('os-online');
      if (!el) return;
      function render(n) {
        el.textContent = I18N.t('menubar.online', { count: Math.max(1, Math.round(Number(n) || 1)) });
      }
      var current = window.XZPresence && window.XZPresence.online ? window.XZPresence.online() : 1;
      render(current);
      window.addEventListener('xz-presence-online', function (e) {
        current = e.detail && e.detail.online;
        render(current);
      });
      window.addEventListener('xz-lang', function () { render(current); });
    })();
  });
</script>
